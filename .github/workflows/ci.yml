name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m grpc_tools.protoc -I./proto --python_out=. --grpc_python_out=. ./proto/file_service.proto
      - run: sed -i 's/import file_service_pb2 as/from proto import file_service_pb2 as/' proto/file_service_pb2_grpc.py
      - run: pytest -q
      - run: docker compose config
